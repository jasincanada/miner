# Call Recorder web container: serve the built SPA and proxy /api to
# the api service on the internal Docker network. This container is
# the ONLY published service (DEPLOY.md, Architecture); the EPYC's
# front nginx / Cloudflare terminates HTTPS in front of it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API — proxied, never served from disk. This location is matched
    # before the SPA fallback below, so try_files can never swallow
    # /api/* (DEPLOY.md, Architecture).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health endpoint of the API, exposed for the updater's checks.
    location = /healthz {
        proxy_pass http://api:3000/healthz;
        proxy_set_header Host $host;
    }

    # Live updates (later slice): Server-Sent Events need buffering
    # OFF and a location of their own, kept separate from any
    # WebSocket location (DEPLOY.md, Architecture). Harmless today —
    # the API does not serve /api/events yet.
    location = /api/events {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
    }

    # Built assets: hashed filenames, cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Scene assets (later slice): the living Christmas scene ships
    # .riv / .wasm files from /scene. Correct MIME types + immutable
    # caching, verified here in the production config per DEPLOY.md's
    # serving checks (DeepSeek-R1 review).
    location /scene/ {
        types {
            application/wasm wasm;
            application/octet-stream riv;
        }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — everything else is the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
