services:
  miner:
    image: ghcr.io/jasincanada/miner:current
    container_name: pearl-miner
    restart: unless-stopped
    stop_grace_period: 30s
    pull_policy: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=pearl-miner
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Optional overrides:
    # environment:
    #   PAYOUT_WALLET: YOUR_SOL_ADDRESS
    #   WORKER: desktop3070ti

  # Polls the registry and recreates the miner when :current changes.
  # Scoped to the pearl-miner scope, so it ignores every other container
  # (including other Watchtowers). The watchtower=false label hides this
  # container from other Watchtower instances, which would otherwise stop
  # it as a "duplicate Watchtower".
  watchtower:
    image: nickfedor/watchtower
    container_name: miner-watchtower
    restart: unless-stopped
    command: --scope pearl-miner --label-enable --cleanup --interval 900
    labels:
      - com.centurylinklabs.watchtower.scope=pearl-miner
      - com.centurylinklabs.watchtower=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
