services:
  miner:
    image: ghcr.io/jasincanada/miner:current
    container_name: pearl-miner
    restart: unless-stopped
    stop_grace_period: 30s
    pull_policy: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=pearl-miner
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Optional overrides:
    # environment:
    #   PAYOUT_WALLET: YOUR_SOL_ADDRESS
    #   WORKER: desktop3070ti

  # Polls the registry and recreates the miner when :current changes.
  # Scope also isolates Watchtower's startup instance cleanup.
  # Keep image cleanup disabled: image IDs can be shared across projects.
  watchtower:
    image: nickfedor/watchtower:1.23.2@sha256:62fb91130ddb493f869cad7e198fa260dd16c5da293ed092cbd5d8781566f7a6
    container_name: miner-watchtower
    restart: unless-stopped
    command: --label-enable --scope pearl-miner --interval 900 pearl-miner
    labels:
      - com.centurylinklabs.watchtower.scope=pearl-miner
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
